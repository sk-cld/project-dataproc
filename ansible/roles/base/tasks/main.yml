---
- name: Create the dataproc group (GID 2048)
  ansible.builtin.group:
    name: "{{ dataproc_user }}"
    gid: "{{ dataproc_uid }}"
    system: true

- name: Create the dataproc service account (UID 2048)
  ansible.builtin.user:
    name: "{{ dataproc_user }}"
    uid: "{{ dataproc_uid }}"
    group: "{{ dataproc_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ app_dir }}"

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

# Allow rules go in BEFORE UFW is enabled, so Ansible never locks itself out.
- name: Deny all incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH for administration (rate limited; AWS limits it to the operator IP)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    comment: ssh-admin

- name: Allow application traffic on port {{ app_port }}
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp
    comment: dataproc-app

- name: Enable UFW
  community.general.ufw:
    state: enabled
